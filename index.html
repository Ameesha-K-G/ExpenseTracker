<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sookshich chelvakikko...</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="material-icons">account_balance_wallet</span> sookshich chelvakikko... </h1>
          

        </header>

        <div class="balance-card">
            <h3>Current Balance</h3>
            <h2 id="balance">₹0.00</h2>
        </div>

        <div class="stats-container">
            <div class="stat-box income">
                <div class="icon-wrapper">
                    <span class="material-icons">arrow_downward</span>
                </div>
                <div>
                    <p>Income</p>
                    <h4 id="money-plus">+₹0.00</h4>
                </div>
            </div>
            <div class="stat-box expense">
                <div class="icon-wrapper">
                    <span class="material-icons">arrow_upward</span>
                </div>
                <div>
                    <p>Expense</p>
                    <h4 id="money-minus">-₹0.00</h4>
                </div>
            </div>
        </div>

        <section class="history-section">
            <h3><span class="material-icons">history</span> Transaction History</h3>
            <ul id="list" class="list">
                </ul>
        </section>

        <section class="add-section">
            <h3><span class="material-icons">add_card</span> Add New Transaction</h3>
            <form id="form">
                <div class="form-control">
                    <label for="text">Description</label>
                    <input type="text" id="text" placeholder="e.g., Salary, Groceries, Pocket Money" required />
                </div>
                <div class="form-control">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" step="any" id="amount" placeholder="e.g., 5000, -250" required />
                    <small>Use <strong>positive</strong> for Income and <strong>negative</strong> for Expense</small>
                </div>
                <button class="btn"><span class="material-icons">add_circle</span> Add Transaction</button>
            </form>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
